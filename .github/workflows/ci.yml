# 검사(10/29 회의 B1). ADR "시험으로 지키는 것" 표의 "매 CI" 줄을 PR마다 실제로 돌려요.
# 자료는 모두 가상(등급 0)이고 AI는 모델을 부르지 않는 fake라서 비밀 값이 필요 없어요.
# postgres 잡은 같은 서버 시험을 실제 PostgreSQL(docker-compose.yml의 db-test)에서 한 번 더 돌려요. 운영 DB와 다르게 도는 곳을 찾아요.
# 두 연결로 겹치는 경쟁 시험은 다음 단계예요(회의록 2절 B1 나머지).
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      # 운영에 들어가는 의존성(--omit=dev)만 봐요. 높음 이상이면 막고, 낮음·중간은 dependabot이 PR로 알려요(11/23 운영 검토).
      - name: 의존성 보안 검사
        run: npm audit --omit=dev --audit-level=high
      - name: 서식 검사
        run: npm run format:check
      - name: 타입 검사
        run: npm run typecheck
      - name: 시험
        run: npm test
      - name: 웹 빌드
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 시험 DB 켜기
        run: npm run db:test:up
      - name: 서버 시험(PostgreSQL)
        run: npm run test:pg

  # 운영 이미지(10/29 배포 준비 회의 A1·A2·A3). 만들고, 읽기 전용 루트·비루트로 시연 설정을 띄워서 연기 시험을 돌려요.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 두 계정 DB 연습(11/25)에 쓰는 시험 전용 PostgreSQL. 운영과 같은 17이에요. 잡이 끝나면 사라져요.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      # 이미지 만들기 캐시(11/23 운영 검토): 바뀌지 않은 층과 npm 내려받기를 GitHub 캐시에서 받아요. 판(DESK_BUILD)이 달라도 의존성 층은 그대로예요.
      - uses: docker/setup-buildx-action@v4
      - name: 이미지 만들기
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: one-line-desk:ci
          build-args: DESK_BUILD=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 이미지에 .env가 없고 root로 돌지 않아요
        run: |
          docker run --rm --entrypoint sh one-line-desk:ci -c 'test ! -e /app/.env && test "$(id -u)" != 0'
          docker image ls one-line-desk:ci --format '이미지 크기 {{.Size}}'
      - name: 시연 설정으로 띄우기
        run: |
          secret() { openssl rand -hex 24; }
          docker run -d --name desk -p 3190:3190 --stop-timeout 50 --read-only --tmpfs /tmp --tmpfs /app/.data:uid=1000,gid=1000 \
            -e DESK_MOCK_LOGIN=true -e PUBLIC_BASE_URL=https://desk.example.test \
            -e SESSION_SECRET="$(secret)" -e PSEUDONYM_SECRET="$(secret)" -e PROPOSAL_SECRET="$(secret)" -e MCP_TOKEN_SECRET="$(secret)" \
            one-line-desk:ci
      - name: 연기 시험
        run: node scripts/smoke.mjs http://localhost:3190
        env:
          SMOKE_BUILD: ${{ github.sha }}
      - name: 멈추면 받던 일을 끝내고 정상으로 나가요
        run: |
          docker stop desk
          test "$(docker inspect -f '{{.State.ExitCode}}' desk)" = 0
      - name: 서버 로그에 쿼리가 남지 않아요(404 카나리)
        run: |
          if docker logs desk 2>&1 | grep -q SMOKE_CANARY; then echo '서버 로그에 쿼리가 남았어요'; exit 1; fi
      # 두 계정 DB 연습(11/25): 회사 첫 배포 순서(회사추가절차 2번)를 실제 PostgreSQL에서 그대로 해 봐요.
      # 소유자 계정으로 마이그레이션 → 권한 SQL(psql) → 앱 계정으로 권한 확인 → 앱 계정으로 띄워 연기 시험(첫 보관 회차까지).
      # 값은 모두 여기서 만든 시험 값이에요. 로그인은 시연(모의)이라 IdP 없이 떠요.
      - name: 두 계정 DB 만들기(소유자·앱)
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1             -c "create role desk_owner login password 'owner_ci'"             -c "create role desk_app login password 'app_ci'"             -c "create database desk owner desk_owner"
      - name: 마이그레이션(소유자) → 권한 SQL → 권한 확인(앱 계정)
        run: |
          secret() { openssl rand -hex 24; }
          run() {
            docker run --rm --network host -e DESK_MOCK_LOGIN=true -e DESK_DEMO_DATABASE=true -e PUBLIC_BASE_URL=https://desk.example.test               -e SESSION_SECRET="$(secret)" -e PSEUDONYM_SECRET="$(secret)" -e PROPOSAL_SECRET="$(secret)" -e MCP_TOKEN_SECRET="$(secret)"               -e DATABASE_URL=postgres://desk_app:app_ci@localhost:5432/desk -e DESK_MIGRATE_DATABASE_URL=postgres://desk_owner:owner_ci@localhost:5432/desk               one-line-desk:ci node --import tsx "$@"
          }
          run apps/server/scripts/migrate.ts
          # btree_gist 확장 함수(확장 주인이 달라요)마다 나오는 "no privileges were granted" 경고는 숨겨요. 오류는 그대로 멈춰요.
          PGPASSWORD=owner_ci PGOPTIONS='-c client_min_messages=error' psql -h localhost -U desk_owner -d desk -v ON_ERROR_STOP=1 -v app_role=desk_app -f db/roles/app-grants.sql
          run apps/server/scripts/grant-check.ts
          # 다시 돌려도 할 일이 없어요(배포 release_command가 이미 적용된 DB에서 돌아도 그대로).
          run apps/server/scripts/migrate.ts | tee migrate-again.log
          grep -q '새로 적용할 마이그레이션이 없어요' migrate-again.log
      # 시연 설정은 뜰 때 마이그레이션을 적용하는데(DESK_MIGRATE_ON_START 기본 켬), 운영은 적용하지 않아요. 운영과 같게 꺼요.
      # 앱 계정은 표를 만들 권한이 없어서 켜 두면 schema_migrations를 만들다 멈춰요(11/25 로컬 연습에서 확인).
      - name: 앱 계정으로 띄워 연기 시험
        run: |
          secret() { openssl rand -hex 24; }
          docker run -d --name desk-pg --network host --read-only --tmpfs /tmp --tmpfs /app/.data:uid=1000,gid=1000             -e DESK_MOCK_LOGIN=true -e DESK_DEMO_DATABASE=true -e PUBLIC_BASE_URL=https://desk.example.test             -e SESSION_SECRET="$(secret)" -e PSEUDONYM_SECRET="$(secret)" -e PROPOSAL_SECRET="$(secret)" -e MCP_TOKEN_SECRET="$(secret)"             -e DESK_MIGRATE_ON_START=false -e DATABASE_URL=postgres://desk_app:app_ci@localhost:5432/desk             one-line-desk:ci
          node scripts/smoke.mjs http://localhost:3190
        env:
          SMOKE_BUILD: ${{ github.sha }}
      - name: 실패하면 서버 로그
        if: failure()
        run: |
          docker logs desk || true
          docker logs desk-pg || true
